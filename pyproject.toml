[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "OmniVLA"
authors = [
    {name = "Noriaki Hirose"},
    {name = "Catherine Glossop"},
    {name = "Dhruv Shah"},
    {name = "Sergey Levine"},    
]
description = "OmniVLA: An Omni-Modal Vision-Language-Action Model for Robot Navigation"
version = "0.0.1"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = {file = "LICENSE"}
dependencies = [
    # Core numerical / scientific computing
    "numpy",
    "scipy",
    "matplotlib",
    # PyTorch / deep learning
    "torch==2.2.0",
    "torchvision==0.17.0",
    "torchaudio==2.2.0",
    "accelerate>=0.25.0",
    "peft==0.11.1",
    "timm==0.9.10",
    "efficientnet_pytorch",
    "diffusers==0.11.1",
    # FlashAttention
    # Install separately AFTER the main environment is working.
    # "flash-attn==2.5.5",
    # Hugging Face / language models
    "huggingface_hub",
    "tokenizers",
    "sentencepiece",
    # OmniVLA / OpenVLA-specific forks
    "transformers @ git+https://github.com/moojink/transformers-openvla-oft.git",  # Bidirectional attention for parallel decoding
    "dlimp @ git+https://github.com/moojink/dlimp_openvla",
    # TensorFlow / data pipeline
    "tensorflow==2.15.0",
    "tensorflow_datasets==4.9.3",
    "tensorflow_graphics==2021.12.3",
    "tensorflow-metadata==1.16.1",
    # Protobuf
    "protobuf>=3.20.3,<4.21",
    # Experiment tracking
    "wandb==0.16.6",
    # Computer vision / image & video
    "opencv-python",
    "Pillow",
    "imageio",
    "av",
    "openai-clip",
    # Data / storage
    "datasets",
    "json-numpy",
    "jsonlines",
    "lmdb",
    "zarr",
    # Configuration / utilities
    "draccus",
    "PyYAML",
    "rich",
    "utm",
    # Web / serving
    "fastapi",
    "uvicorn",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "prismatic*",
    "inference*",
    "config_nav*",
]
exclude = [
    "cache*",
    "experiments*",
]

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }

#[[tool.uv.index]]
#name = "astral-cu130"
#url = "https://wheels.astral.sh/simple/cu130/"
#explicit = true

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.extra-build-dependencies]
flash-attn = [
    { requirement = "torch", match-runtime = true }
]